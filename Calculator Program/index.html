<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Program</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <div class="container">


        <div class="heading">
            Calculator Program
        </div>

        
        
            <div class="main">
                 <div class="spacebar"></div>
          <div class="sections">
            
       
            <div class="first-section">
            <span class="AC">AC</span>
            <span class="percent">%</span>
            <span class="back">X</span>
            <span class="division">:-</span>
            </div>

             <div class="second-section">   
             <span class="btn">7</span>
            <span class="btn">8</span>
            <span class="btn">9</span>
            <span class="btn">*</span>
            </div>


             <div class="third-section">
            <span class="btn">4</span>
            <span class="btn">5</span>
            <span class="btn">6</span>
            <span class="minus">-</span>
            </div>
          
            
            <div class="fourth-section">
            <span class="btn">1</span>
            <span class="btn">2</span>
            <span class="btn">3</span>
            <span class="addition">+</span>
           </div>


            <div class="fifth-section">
            <span class="btn">0</span>
            <span class="btn">00</span>
            <span class="btn">.</span>
            <span class="btn">=</span>
            </div>
       
          </div>
    
        </div>
        </div>

</body>
</html>
