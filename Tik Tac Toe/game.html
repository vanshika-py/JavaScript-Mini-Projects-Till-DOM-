<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>
    <style>
        /* CSS STYLES */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass-bg: rgba(255, 255, 255, 0.95);
            --x-color: #ff4757;
            --o-color: #2ed573;
            --text-color: #2f3542;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--primary-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* Container */
        .container {
            background: var(--glass-bg);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            width: 90%;
            max-width: 450px;
            position: relative;
            overflow: hidden;
        }

        h1 {
            color: var(--text-color);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.8rem;
        }

        /* Buttons */
        .btn {
            background: #2f3542;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn-restart {
            background: linear-gradient(45deg, #ff9a9e, #fad0c4);
            color: #444;
            font-weight: bold;
        }

        /* Start Screen & Inputs */
        .start-screen {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            outline: none;
            text-align: center;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #764ba2;
        }

        /* Game Area */
        .game-area {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .status-text {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 15px;
            background: -webkit-linear-gradient(#667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            font-weight: 600;
            color: #555;
        }

        .score-box {
            background: white;
            padding: 5px 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* The Grid */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .cell {
            background: #fff;
            height: 100px;
            border-radius: 15px;
            border: none;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
            font-size: 3rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s;
        }

        .cell:hover {
            background: #f1f2f6;
        }

        .cell.x { color: var(--x-color); }
        .cell.o { color: var(--o-color); }

        /* Winner Modal/Popup */
        .winner-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.98);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transform: scale(0);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .winner-modal.active {
            transform: scale(1);
        }

        .winner-text {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 20px;
            padding: 0 20px;
        }

        .winner-emoji {
            font-size: 4rem;
            margin-bottom: 10px;
            animation: bounce 1s infinite;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .hidden { display: none !important; }

    </style>
</head>
<body>

    <div class="container">
        <h1>Tic Tac Toe Game</h1>

        <!-- Screen 1: Name Input -->
        <div id="start-screen" class="start-screen">
            <p>Enter Player Names to Start</p>
            <input type="text" id="playerX" placeholder="Player 1 (X) Name">
            <input type="text" id="playerO" placeholder="Player 2 (O) Name">
            <button class="btn" onclick="startGame()">Start Game</button>
        </div>

        <!-- Screen 2: The Game -->
        <div id="game-area" class="game-area">
            <div id="status-text" class="status-text">Let's Play!</div>
            
            <div class="scoreboard">
                <div class="score-box"><span id="p1-name-display">P1</span>: <span id="score-x">0</span></div>
                <div class="score-box"><span id="p2-name-display">P2</span>: <span id="score-o">0</span></div>
            </div>

            <div class="board" id="board">
                <div class="cell" data-cell></div>
                <div class="cell" data-cell></div>
                <div class="cell" data-cell></div>
                <div class="cell" data-cell></div>
                <div class="cell" data-cell></div>
                <div class="cell" data-cell></div>
                <div class="cell" data-cell></div>
                <div class="cell" data-cell></div>
                <div class="cell" data-cell></div>
            </div>
            
            <button class="btn" onclick="resetGame()">New Game (Reset Names)</button>
        </div>

        <!-- Winner Popup -->
        <div id="winner-modal" class="winner-modal">
            <div class="winner-emoji">🏆</div>
            <div class="winner-text" id="winner-message"></div>
            <button class="btn btn-restart" onclick="restartMatch()">Restart Game 😊</button>
        </div>
    </div>

    <script>
        // --- JAVASCRIPT LOGIC --- //

        // Game State Variables (Decoupled from the DOM for accuracy)
        let boardState = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X"; 
        let gameActive = false; // Locks the board when someone wins
        
        // Players & Score
        let p1Name = "Player X";
        let p2Name = "Player O";
        let scoreX = 0;
        let scoreO = 0;
        
        // Winning combinations (indices)
        const WINNING_COMBINATIONS = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Horizontal
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Vertical
            [0, 4, 8], [2, 4, 6]             // Diagonal
        ];

        // Select Elements
        const startScreen = document.getElementById('start-screen');
        const gameArea = document.getElementById('game-area');
        const cellElements = document.querySelectorAll('[data-cell]');
        const statusText = document.getElementById('status-text');
        const p1Display = document.getElementById('p1-name-display');
        const p2Display = document.getElementById('p2-name-display');
        const scoreXDisplay = document.getElementById('score-x');
        const scoreODisplay = document.getElementById('score-o');
        const winnerModal = document.getElementById('winner-modal');
        const winnerMessage = document.getElementById('winner-message');

        // Attach listeners exactly once using data-index
        cellElements.forEach((cell, index) => {
            cell.setAttribute('data-index', index);
            cell.addEventListener('click', handleClick);
        });

        // Start Game
        function startGame() {
            const p1Input = document.getElementById('playerX').value.trim();
            const p2Input = document.getElementById('playerO').value.trim();

            if (p1Input) p1Name = p1Input;
            if (p2Input) p2Name = p2Input;

            p1Display.textContent = p1Name;
            p2Display.textContent = p2Name;

            startScreen.classList.add('hidden');
            gameArea.style.display = 'block';
            
            gameActive = true;
            updateTurnMessage();
        }

        // Handle Clicks Safely
        function handleClick(e) {
            const cell = e.target;
            const index = cell.getAttribute('data-index');

            // Prevent clicking on already filled cells OR if game is over
            if (boardState[index] !== "" || !gameActive) return;

            // 1. Place Mark securely in logic & DOM
            boardState[index] = currentPlayer;
            const currentClass = currentPlayer === "X" ? "x" : "o";
            cell.classList.add(currentClass);
            cell.textContent = currentPlayer;

            // 2. Check for Win or Draw
            if (checkWin()) {
                endGame(false);
            } else if (isDraw()) {
                endGame(true);
            } else {
                // 3. Swap Turns
                currentPlayer = currentPlayer === "X" ? "O" : "X";
                updateTurnMessage();
            }
        }

        // Visual Turn Indication
        function updateTurnMessage() {
            statusText.textContent = `${currentPlayer === "X" ? p1Name : p2Name}'s Turn`;
            statusText.style.color = currentPlayer === "X" ? 'var(--x-color)' : 'var(--o-color)';
        }

        // Winning Logic reading purely from the array
        function checkWin() {
            return WINNING_COMBINATIONS.some(combination => {
                return combination.every(index => {
                    return boardState[index] === currentPlayer;
                });
            });
        }

        // Draw Logic
        function isDraw() {
            return !boardState.includes("");
        }

        // End Game & Show Result
        function endGame(draw) {
            gameActive = false; // Prevents any clicks during animations

            if (draw) {
                winnerMessage.innerText = "It's a Draw! 🤝";
            } else {
                const winnerName = currentPlayer === "X" ? p1Name : p2Name;
                winnerMessage.innerText = `${winnerName} is the winner! Congratulations! 🎉`;
                
                if (currentPlayer === "X") {
                    scoreX++;
                    scoreXDisplay.textContent = scoreX;
                } else {
                    scoreO++;
                    scoreODisplay.textContent = scoreO;
                }
            }
            winnerModal.classList.add('active');
        }

        // Restart Match without reloading Event Listeners
        function restartMatch() {
            winnerModal.classList.remove('active');
            
            // Clean logic state
            boardState = ["", "", "", "", "", "", "", "", ""];
            currentPlayer = "X";
            gameActive = true;

            // Clean DOM visually
            cellElements.forEach(cell => {
                cell.classList.remove('x', 'o');
                cell.textContent = '';
            });

            statusText.textContent = "Let's Play Again!";
            setTimeout(updateTurnMessage, 800);
        }

        // Full Game Reset
        function resetGame() {
            // Reset logic vars
            scoreX = 0;
            scoreO = 0;
            scoreXDisplay.textContent = '0';
            scoreODisplay.textContent = '0';
            p1Name = "Player X";
            p2Name = "Player O";
            document.getElementById('playerX').value = "";
            document.getElementById('playerO').value = "";

            // UI Reset
            gameArea.style.display = 'none';
            startScreen.classList.remove('hidden');
            winnerModal.classList.remove('active');
            
            boardState = ["", "", "", "", "", "", "", "", ""];
            gameActive = false;
            currentPlayer = "X";

            cellElements.forEach(cell => {
                cell.classList.remove('x', 'o');
                cell.textContent = '';
            });
        }
    </script>
</body>
</html>
