<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather App</title>
<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>
</head>

<body>

<div class="header">

<h1>Weather App</h1>

<div class="Search-Section">
<input type="text" placeholder="Search City Name" class="inputCity">
<button class="submit">Submit</button>
</div>

<p class="error-message"></p>

<div class="Temperature-details">
<div class="city-name">Search Any city 🌍</div>
<div class="temperature">--°C</div>
<div class="weather-icon"></div>


<div class="cards">

<div class="card">
<h3><i class="fa-solid fa-droplet"></i> Humidity</h3>
<p class="humidity"></p>
</div>

<div class="card">
<h3><i class="fa-solid fa-wind"></i> Wind</h3>
<p class="wind"></p>
</div>

<div class="card">
<h3><i class="fa-solid fa-temperature-three-quarters"></i> Feels Like</h3>
<p class="feels"></p>
</div>



</div>

</div>

<script src="script.js"></script>

</body>
</html>
